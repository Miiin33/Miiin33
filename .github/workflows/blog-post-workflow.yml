name: Latest blog post workflow

on:
  # schedule:
  #   - cron: '0 */6 * * *'
  # ↑ 暂时关闭定时触发，等配置好真实 RSS 地址后取消注释即可自动运行
  workflow_dispatch: # 保留手动触发入口

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        continue-on-error: true   # RSS 未配置时静默跳过，不报错
        with:
          # ────────────────────────────────────────────
          # 激活方式：
          # 1. 在公众号 / 知乎后台开启 RSS
          # 2. 将下方 feed_list 替换为你的真实 RSS 地址
          # 3. 多个源用逗号分隔，示例：
          #    feed_list: "https://zhihu-rss.example.com/feed, https://wechat-rss.example.com/feed"
          # 4. 同时取消上方 schedule 注释，即可自动每 6 小时更新
          # ────────────────────────────────────────────
          feed_list: "https://example.com/feed.xml"
          max_post_count: 5
          template: "- [$title]($url) &mdash; $date"
